[project]
name = "zigbee-activity-viewer"
version = "0.1.0"
description = "Export Zigbee PCAP-derived activity fields to ParaView-friendly point clouds and volumes."
requires-python = ">=3.10"

[project.scripts]
zigbee-activity-viewer = "zigbee_activity_viewer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
